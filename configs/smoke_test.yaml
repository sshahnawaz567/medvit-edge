# Smoke-test configuration — NOT a real experiment.
#
# Points at the small Kaggle "nih-chest-xrays/sample" dataset (~5,600 images,
# no official patient-level split files) purely to verify the Phase 1 pipeline
# (data loading -> model -> training loop -> W&B logging -> checkpointing)
# runs end-to-end before committing to the full ~45GB NIH download.
#
# The train/val/test split here is a throwaway random split generated just for
# this smoke test — it is NOT the official patient-level split and the AUROC
# this produces means nothing scientifically. Do not report numbers from this
# config anywhere in reports/.
version: "0.1.0-smoketest"

data:
  data_dir: "data/nih-sample"
  labels_csv: "sample_labels.csv"
  train_val_list: "smoke_train_val_list.txt"
  test_list: "smoke_test_list.txt"
  val_fraction: 0.1
  image_size: 224
  num_workers: 2

classes:
  - Atelectasis
  - Cardiomegaly
  - Effusion
  - Infiltration
  - Mass
  - Nodule
  - Pneumonia
  - Pneumothorax
  - Consolidation
  - Edema
  - Emphysema
  - Fibrosis
  - Pleural_Thickening
  - Hernia

model:
  architecture: "resnet50"
  pretrained: true
  num_classes: 14
  dropout: 0.2

training:
  seed: 42
  batch_size: 16
  epochs: 2                # just enough to confirm the loop runs and loss moves
  optimizer: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: "cosine"
  warmup_epochs: 1
  mixed_precision: true
  class_weighting: "inverse_frequency"
  early_stopping_patience: 5
  checkpoint_dir: "checkpoints/smoke_test"
  log_every_n_steps: 10

wandb:
  project: "medvit-edge"
  entity: null
  run_name: "phase1-smoke-test"
  tags: ["smoke-test", "not-for-reports"]
  log_gpu_memory: true
